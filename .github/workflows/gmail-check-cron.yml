name: Gmail check cron

# Vercel's Hobby plan only allows cron jobs that fire once a day (a more
# frequent schedule in vercel.json fails to deploy at all) — this workflow
# is the substitute trigger so the check can still run every 10 minutes
# without needing a paid Vercel plan. It just calls the app's own
# CRON_SECRET-gated route (app/api/cron/gmail-check/route.ts); the route
# doesn't care who calls it, so no app code changes were needed for this.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call gmail-check
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/gmail-check"
